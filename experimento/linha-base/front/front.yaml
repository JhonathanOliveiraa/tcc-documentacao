apiVersion: v1
kind: Namespace
metadata:
  name: manual-front
  labels:
    tcc/exposto: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: manual-front
spec:
  replicas: 1
  selector: { matchLabels: { app: front } }
  template:
    metadata: { labels: { app: front } }
    spec:
      containers:
        - name: front
          image: docker.io/library/catalogo-front:manual-1
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: API_BASE_URL, value: "https://manual-api.tcc.altasistemas.com.br" }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: manual-front
spec:
  selector: { app: front }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: front
  namespace: manual-front
spec:
  parentRefs: [{ name: kong, namespace: kong, sectionName: https-tcc }]
  hostnames: [manual-front.tcc.altasistemas.com.br]
  rules: [{ backendRefs: [{ name: front, port: 80 }] }]
