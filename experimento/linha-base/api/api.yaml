apiVersion: v1
kind: Namespace
metadata:
  name: manual-api
  labels:
    tcc/exposto: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: manual-api
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: manual-api
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: catalogo }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: banco, key: usuario } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: banco, key: senha } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: dados, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: dados }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: manual-api
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: docker.io/library/catalogo-api:manual-1
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Catalogo
              valueFrom: { secretKeyRef: { name: banco, key: connection-string } }
            - { name: Cors__OrigensPermitidas, value: "https://manual-front.tcc.altasistemas.com.br" }
            - { name: OTEL_SERVICE_NAME, value: catalogo-api-manual }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://grafana-cloud-otel-receiver.monitoring.svc.cluster.local:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: deployment.environment=manual }
          readinessProbe: { httpGet: { path: /health, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: manual-api
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: manual-api
spec:
  parentRefs: [{ name: kong, namespace: kong, sectionName: https-tcc }]
  hostnames: [manual-api.tcc.altasistemas.com.br]
  rules: [{ backendRefs: [{ name: api, port: 80 }] }]
